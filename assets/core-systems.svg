  <rect width="1200" height="126" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="124" rx="17" fill="none" stroke="#475569" stroke-opacity=".55"/>
  <rect x="25" y="18" width="1150" height="2" rx="1" fill="url(#topLine)"/>

