<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Mission status</title>
  <desc id="desc">Current base Tokyo, origin Thailand, role Full-Stack Developer, and next targets JLPT N2, Go, and Rust.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".5" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#170A2E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".35" stop-color="#7C3AED"/>
      <stop offset=".7" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#F472B6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="230" rx="22" fill="url(#bg)"/>
  <ellipse cx="100" cy="30" rx="270" ry="130" fill="url(#glowCyan)"/>
  <ellipse cx="1080" cy="210" rx="310" ry="140" fill="url(#glowPink)"/>
  <rect x="1" y="1" width="1198" height="228" rx="21" fill="none" stroke="#8B5CF6" stroke-opacity=".34" stroke-width="2"/>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <circle cx="34" cy="29" r="5" fill="#22D3EE"/>
    <circle cx="52" cy="29" r="5" fill="#7C3AED"/>
    <circle cx="70" cy="29" r="5" fill="#F472B6"/>
    <text x="94" y="34" fill="#CBD5E1" font-size="13" font-weight="700" letter-spacing="3">MISSION STATUS  //  ONLINE</text>

    <g>
      <rect x="28" y="58" width="270" height="132" rx="16" fill="#071827" stroke="#22D3EE" stroke-opacity=".58"/>
