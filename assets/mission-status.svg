      <circle cx="262" cy="83" r="6" fill="#22D3EE"/>
      <text x="52" y="91" fill="#67E8F9" font-size="12" font-weight="700" letter-spacing="2.2">CURRENT BASE</text>
      <text x="52" y="132" fill="#F8FAFC" font-size="24" font-weight="800">TOKYO, JAPAN</text>
      <text x="52" y="160" fill="#94A3B8" font-size="13" letter-spacing="1.2">BUILDING THE NEXT CHAPTER</text>
    </g>

    <g>
      <rect x="319" y="58" width="270" height="132" rx="16" fill="#11102A" stroke="#8B5CF6" stroke-opacity=".62"/>
      <rect x="319" y="58" width="5" height="132" rx="2.5" fill="#8B5CF6"/>
      <circle cx="553" cy="83" r="6" fill="#A78BFA"/>
      <text x="343" y="91" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="2.2">ORIGIN</text>
      <text x="343" y="132" fill="#F8FAFC" font-size="24" font-weight="800">THAILAND</text>
      <text x="343" y="160" fill="#94A3B8" font-size="13" letter-spacing="1.2">TECH × CULTURE × CURIOSITY</text>
    </g>

    <g>
      <rect x="610" y="58" width="270" height="132" rx="16" fill="#211023" stroke="#F472B6" stroke-opacity=".62"/>
      <rect x="610" y="58" width="5" height="132" rx="2.5" fill="#F472B6"/>
      <circle cx="844" cy="83" r="6" fill="#F9A8D4"/>
