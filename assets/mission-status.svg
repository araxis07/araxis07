      <text x="634" y="128" fill="#F8FAFC" font-size="21" font-weight="800">FULL-STACK</text>
      <text x="634" y="154" fill="#F8FAFC" font-size="18" font-weight="700">DEVELOPER</text>
      <text x="634" y="175" fill="#94A3B8" font-size="11" letter-spacing="1">ENGINEERING • DATA • DESIGN</text>
    </g>

    <g>
