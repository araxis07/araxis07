<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 88" width="1000" height="88" role="img" aria-label="03 / PROJECTS">
    <title>03 / PROJECTS</title><style>:root{--bg:#0b0d17;--ink:#eff1ff;--muted:#a7b0cb;--rule:#30364f;--accent:#b6a0ff;--cyan:#65d9ed;--pink:#ee9bc8;--soft:#151729;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="1000" height="88" fill="#0b0d17"/><path d="M48 17H952" stroke="#30364f" class=""/><text x="48" y="65" font-size="34" fill="#b6a0ff" >03</text><text x="115" y="60" font-size="17" fill="#eff1ff" letter-spacing="2">PROJECTS</text><text x="952" y="60" font-size="12" fill="#a7b0cb" text-anchor="end">~/selected</text></svg>
