<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500" role="img" aria-label="Technical stack includes React, Next.js, TypeScript, JavaScript, Tailwind CSS, Material UI, Node.js, NestJS, Express, REST APIs, authentication, PostgreSQL, MySQL, Supabase, SQLite, pgvector, Recharts, Git, GitHub Actions, Docker, Playwright, Vite and Postman">
    <title>Technical stack includes React, Next.js, TypeScript, JavaScript, Tailwind CSS, Material UI, Node.js, NestJS, Express, REST APIs, authentication, PostgreSQL, MySQL, Supabase, SQLite, pgvector, Recharts, Git, GitHub Actions, Docker, Playwright, Vite and Postman</title><style>:root{--bg:#0b0d17;--ink:#eff1ff;--muted:#a7b0cb;--rule:#30364f;--accent:#b6a0ff;--cyan:#65d9ed;--pink:#ee9bc8;--soft:#151729;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="440" height="500" fill="#0b0d17"/><text x="22" y="29" font-size="12" fill="#b6a0ff" letter-spacing="2">FRONTEND</text><text x="22" y="60" font-size="14" fill="#eff1ff" >React / Next.js / TypeScript</text><text x="22" y="85" font-size="14" fill="#a7b0cb" >JavaScript / Tailwind CSS / Material UI</text><path d="M22 123H418" stroke="#30364f" class=""/><text x="22" y="147" font-size="12" fill="#b6a0ff" letter-spacing="2">BACKEND</text><text x="22" y="178" font-size="14" fill="#eff1ff" >Node.js / NestJS / Express</text><text x="22" y="203" font-size="14" fill="#a7b0cb" >REST APIs / Authentication</text><path d="M22 241H418" stroke="#30364f" class=""/><text x="22" y="265" font-size="12" fill="#b6a0ff" letter-spacing="2">DATA</text><text x="22" y="296" font-size="14" fill="#eff1ff" >PostgreSQL / MySQL / Supabase</text><text x="22" y="321" font-size="14" fill="#a7b0cb" >SQLite / pgvector / Recharts</text><path d="M22 359H418" stroke="#30364f" class=""/><text x="22" y="383" font-size="12" fill="#b6a0ff" letter-spacing="2">WORKFLOW</text><text x="22" y="414" font-size="14" fill="#eff1ff" >Git / GitHub Actions / Docker</text><text x="22" y="439" font-size="14" fill="#a7b0cb" >Playwright / Vite / Postman</text><path d="M22 477H418" stroke="#30364f" class=""/></svg>
