<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 409" width="440" height="409" role="img" aria-label="About Aon: TNI Information Technology graduate with Second-Class Honors; building web products, learning Go, Rust and Japanese, with JLPT N2 as a long-term goal">
    <title>About Aon: TNI Information Technology graduate with Second-Class Honors; building web products, learning Go, Rust and Japanese, with JLPT N2 as a long-term goal</title><style>:root{--bg:#0b0d17;--ink:#eff1ff;--muted:#a7b0cb;--rule:#30364f;--accent:#b6a0ff;--cyan:#65d9ed;--pink:#ee9bc8;--soft:#151729;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="440" height="409" fill="#0b0d17"/><text x="22" y="27" font-size="16" fill="#eff1ff" >Hello, I’m Aon — a developer who enjoys</text><text x="22" y="52" font-size="16" fill="#eff1ff" >turning complex ideas into practical</text><text x="22" y="77" font-size="16" fill="#eff1ff" >digital products.</text><text x="22" y="116" font-size="16" fill="#eff1ff" >B.Sc. Information Technology, Thai-</text><text x="22" y="141" font-size="16" fill="#eff1ff" >Nichi Institute of Technology. Second-</text><text x="22" y="166" font-size="16" fill="#eff1ff" >Class Honors.</text><text x="22" y="205" font-size="16" fill="#a7b0cb" >My work spans frontend interfaces,</text><text x="22" y="230" font-size="16" fill="#a7b0cb" >backend APIs, dashboards and data-rich</text><text x="22" y="255" font-size="16" fill="#a7b0cb" >experiences.</text><path d="M22 294H418" stroke="#30364f" class=""/><text x="22" y="327" font-size="15" fill="#b6a0ff" >LEARNING / Go, Rust and Japanese.</text><text x="22" y="364" font-size="15" fill="#a7b0cb" >LONG-TERM LANGUAGE GOAL / JLPT N2.</text></svg>
