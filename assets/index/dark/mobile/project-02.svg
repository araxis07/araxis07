<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 213" width="440" height="213" role="img" aria-label="AI Knowledge Base. Private document workspaces, hybrid search and grounded AI answers with visible source citations. Stack: Next.js / Supabase / pgvector / Playwright. Status: Live AI flows require provider configuration.">
    <title>AI Knowledge Base. Private document workspaces, hybrid search and grounded AI answers with visible source citations. Stack: Next.js / Supabase / pgvector / Playwright. Status: Live AI flows require provider configuration.</title><style>:root{--bg:#0b0d17;--ink:#eff1ff;--muted:#a7b0cb;--rule:#30364f;--accent:#b6a0ff;--cyan:#65d9ed;--pink:#ee9bc8;--soft:#151729;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
