<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 293" width="440" height="293" role="img" aria-label="Sakura Trails. Japan travel guide with 93 destinations, four languages, a seasonal 3D landscape and local trip planning. Stack: React / TypeScript / Three.js / Leaflet. Status: Local-first guide and planner; no booking service.">
    <title>Sakura Trails. Japan travel guide with 93 destinations, four languages, a seasonal 3D landscape and local trip planning. Stack: React / TypeScript / Three.js / Leaflet. Status: Local-first guide and planner; no booking service.</title><style>:root{--bg:#0b0d17;--ink:#eff1ff;--muted:#a7b0cb;--rule:#30364f;--accent:#b6a0ff;--cyan:#65d9ed;--pink:#ee9bc8;--soft:#151729;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="440" height="293" fill="#0b0d17"/><text x="22" y="26" font-size="11" fill="#b6a0ff" letter-spacing="1.2">05 / JAPAN TRAVEL</text><text x="22" y="61" font-size="24" fill="#eff1ff" >Sakura Trails</text><text x="22" y="93" font-size="16" fill="#eff1ff" >Japan travel guide with 93</text><text x="22" y="118" font-size="16" fill="#eff1ff" >destinations, four languages, a</text><text x="22" y="143" font-size="16" fill="#eff1ff" >seasonal 3D landscape and local trip</text><text x="22" y="168" font-size="16" fill="#eff1ff" >planning.</text><text x="22" y="203" font-size="13" fill="#65d9ed" >React / TypeScript / Three.js / Leaflet</text><text x="22" y="233" font-size="12" fill="#a7b0cb" >Local-first guide and planner; no booking</text><text x="22" y="254" font-size="12" fill="#a7b0cb" >service.</text><path d="M22 276H418" stroke="#30364f" class=""/></svg>
