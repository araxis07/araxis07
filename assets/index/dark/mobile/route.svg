<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 675" width="440" height="675" role="img" aria-label="Journey: TNI Information Technology 2021–2025, GPAX 3.45 and Second-Class Honors; Teaching Assistant June 2021–October 2024; four-month Suvarnabhumi Airport IT Support internship December 2024–March 2025; Akamonkai Japanese Language School, Tokyo, January–December 2026. JLPT N2 is a learning goal.">
    <title>Journey: TNI Information Technology 2021–2025, GPAX 3.45 and Second-Class Honors; Teaching Assistant June 2021–October 2024; four-month Suvarnabhumi Airport IT Support internship December 2024–March 2025; Akamonkai Japanese Language School, Tokyo, January–December 2026. JLPT N2 is a learning goal.</title><style>:root{--bg:#0b0d17;--ink:#eff1ff;--muted:#a7b0cb;--rule:#30364f;--accent:#b6a0ff;--cyan:#65d9ed;--pink:#ee9bc8;--soft:#151729;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
