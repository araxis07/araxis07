    <rect width="440" height="495" fill="#0b0d17"/><text x="22" y="31" font-size="12" fill="#b6a0ff" letter-spacing="1">EDUCATION / 2025</text><text x="22" y="58" font-size="17" fill="#eff1ff" >Thai-Nichi Institute of Technology</text><text x="22" y="87" font-size="15" fill="#a7b0cb" >B.Sc. Information Technology / Second-</text><text x="22" y="110" font-size="15" fill="#a7b0cb" >Class Honors.</text><path d="M22 137H418" stroke="#30364f" class=""/><text x="22" y="164" font-size="12" fill="#b6a0ff" letter-spacing="1">EXPERIENCE / 4 MONTHS</text><text x="22" y="191" font-size="17" fill="#eff1ff" >IT Support Intern / Suvarnabhumi</text><text x="22" y="215" font-size="17" fill="#eff1ff" >Airport</text><text x="22" y="244" font-size="15" fill="#a7b0cb" >Computer-system troubleshooting,</text><text x="22" y="267" font-size="15" fill="#a7b0cb" >operational support and a data-</text><text x="22" y="290" font-size="15" fill="#a7b0cb" >visualization dashboard.</text><path d="M22 317H418" stroke="#30364f" class=""/><text x="22" y="344" font-size="12" fill="#b6a0ff" letter-spacing="1">CURRENT CHAPTER / 2026</text><text x="22" y="371" font-size="17" fill="#eff1ff" >Tokyo, Japan</text><text x="22" y="400" font-size="15" fill="#a7b0cb" >Studying Japanese while continuing to</text><text x="22" y="423" font-size="15" fill="#a7b0cb" >explore software, data and new</text><text x="22" y="446" font-size="15" fill="#a7b0cb" >experiences.</text><path d="M22 473H418" stroke="#30364f" class=""/></svg>
