<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 584" width="440" height="584" role="img" aria-label="Journey: TNI Information Technology graduate in 2025, four-month IT Support internship at Suvarnabhumi Airport, and Japanese study in Tokyo in 2026">
