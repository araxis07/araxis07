<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 143" width="440" height="143" role="img" aria-label="Stay curious. Build with intent. Aon / araxis07 / building beyond the horizon">
    <title>Stay curious. Build with intent. Aon / araxis07 / building beyond the horizon</title><style>:root{--bg:#0b0d17;--ink:#eff1ff;--muted:#a7b0cb;--rule:#30364f;--accent:#b6a0ff;--cyan:#65d9ed;--pink:#ee9bc8;--soft:#151729;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
