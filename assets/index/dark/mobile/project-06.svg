<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 254" width="440" height="254" role="img" aria-label="Roam America. Explore all 50 U.S. states in five languages with daily itineraries, offline guides and local trip planning. Stack: React / TypeScript / Vite / optional Supabase. Status: Local planning needs no account; cloud services are optional.">
    <title>Roam America. Explore all 50 U.S. states in five languages with daily itineraries, offline guides and local trip planning. Stack: React / TypeScript / Vite / optional Supabase. Status: Local planning needs no account; cloud services are optional.</title><style>:root{--bg:#0b0d17;--ink:#eff1ff;--muted:#a7b0cb;--rule:#30364f;--accent:#b6a0ff;--cyan:#65d9ed;--pink:#ee9bc8;--soft:#151729;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="440" height="254" fill="#0b0d17"/><text x="22" y="22" font-size="11" fill="#b6a0ff" letter-spacing="1">06 / USA TRAVEL</text><text x="22" y="50" font-size="19" fill="#eff1ff" >Roam America</text><text x="22" y="78" font-size="15" fill="#eff1ff" >Explore all 50 U.S. states in five</text><text x="22" y="101" font-size="15" fill="#eff1ff" >languages with daily itineraries, offline</text><text x="22" y="124" font-size="15" fill="#eff1ff" >guides and local trip planning.</text><text x="22" y="154" font-size="13" fill="#65d9ed" >React / TypeScript / Vite / optional</text><text x="22" y="175" font-size="13" fill="#65d9ed" >Supabase</text><text x="22" y="202" font-size="12" fill="#a7b0cb" >Local planning needs no account; cloud</text><text x="22" y="222" font-size="12" fill="#a7b0cb" >services are optional.</text><path d="M22 243H418" stroke="#30364f" class=""/></svg>
