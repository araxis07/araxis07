<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 233" width="440" height="233" role="img" aria-label="Sakura Trails. Japan travel guide with 93 destinations, four languages, a seasonal 3D landscape and local trip planning. Stack: React / TypeScript / Three.js / Leaflet. Status: Local-first guide and planner; no booking service.">
    <title>Sakura Trails. Japan travel guide with 93 destinations, four languages, a seasonal 3D landscape and local trip planning. Stack: React / TypeScript / Three.js / Leaflet. Status: Local-first guide and planner; no booking service.</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="440" height="233" fill="#faf9ff"/><text x="22" y="22" font-size="11" fill="#6743b4" letter-spacing="1">05 / JAPAN TRAVEL</text><text x="22" y="50" font-size="19" fill="#232339" >Sakura Trails</text><text x="22" y="78" font-size="15" fill="#232339" >Japan travel guide with 93 destinations,</text><text x="22" y="101" font-size="15" fill="#232339" >four languages, a seasonal 3D landscape</text><text x="22" y="124" font-size="15" fill="#232339" >and local trip planning.</text><text x="22" y="154" font-size="13" fill="#086d85" >React / TypeScript / Three.js / Leaflet</text><text x="22" y="181" font-size="12" fill="#565e77" >Local-first guide and planner; no booking</text><text x="22" y="201" font-size="12" fill="#565e77" >service.</text><path d="M22 222H418" stroke="#d2d3e4" class=""/></svg>
