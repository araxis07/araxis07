<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 736" width="440" height="736" role="img" aria-label="Technical stack: LANGUAGES: TypeScript / JavaScript / Python, Go / Rust / Ruby / SQL; FRONTEND: Next.js / React / Tailwind CSS, Material UI / HTML / CSS; BACKEND: Node.js / NestJS / Express, REST APIs / Authentication; DATA &amp; STORAGE: PostgreSQL / Supabase / MySQL, SQLite / pgvector / Recharts; TESTING &amp; QUALITY: Playwright / Postman, E2E testing / API testing; DELIVERY &amp; TOOLS: Git / GitHub / GitHub Actions, CI/CD pipelines / Docker / Vite">
    <title>Technical stack: LANGUAGES: TypeScript / JavaScript / Python, Go / Rust / Ruby / SQL; FRONTEND: Next.js / React / Tailwind CSS, Material UI / HTML / CSS; BACKEND: Node.js / NestJS / Express, REST APIs / Authentication; DATA &amp; STORAGE: PostgreSQL / Supabase / MySQL, SQLite / pgvector / Recharts; TESTING &amp; QUALITY: Playwright / Postman, E2E testing / API testing; DELIVERY &amp; TOOLS: Git / GitHub / GitHub Actions, CI/CD pipelines / Docker / Vite</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
