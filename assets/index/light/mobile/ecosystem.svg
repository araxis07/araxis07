le="animation-delay:-1.1s"/><g><path class="sm-panel" d="M89 344H340V421L331 430H80V353Z" fill="#f0edf9" stroke="#d2d3e4" stroke-width="1"/><path d="M80 365V353L89 344H114" fill="none" stroke="#6743b4" stroke-width="2"/><text class="sm-type" x="97" y="373" font-size="20" fill="#232339" >AI Knowledge Base</text><text class="sm-type" x="97" y="395" font-size="13" fill="#565e77" >Document search + grounded Q&amp;A</text><text class="sm-type" x="97" y="416" font-size="11" fill="#6743b4" >Next.js / pgvector</text></g><text class="sm-type" x="80" y="458" font-size="12" fill="#086d85" letter-spacing="1.1">DATA INTERFACES</text><text class="sm-type" x="80" y="475" font-size="10" fill="#565e77" letter-spacing="1">01 PROJECT</text><circle cx="52" cy="464" r="4" fill="#086d85"/><path d="M52 178V505Q52 521 68 521H80" fill="none" stroke="#086d85" stroke-width="1.2" opacity=".38"/><path d="M52 178V505Q52 521 68 521H80" fill="none" stroke="#086d85" class="sm-signal" pathLength="100" stroke-width="2.4" stroke-linecap="round" style="animation-delay:-2.2s"/><g><path class="sm-panel" d="M89 478H340V555L331 564H80V487Z" fill="#f0edf9" stroke="#d2d3e4" stroke-width="1"/><path d="M80 499V487L89 478H114" fill="none" stroke="#086d85" stroke-width="2"/><text class="sm-type" x="97" y="507" font-size="20" fill="#232339" >Finance Dashboard</text><text class="sm-type" x="97" y="529" font-size="13" fill="#565e77" >Local finance dashboard</text><text class="sm-type" x="97" y="550" font-size="11" fill="#086d85" >Next.js / Recharts</text></g><text class="sm-type" x="80" y="592" font-size="12" fill="#a93072" letter-spacing="1.1">TRAVEL EXPERIENCES</text><text class="sm-type" x="80" y="609" font-size="10" fill="#565e77" letter-spacing="1">02 PROJECTS</text><circle cx="52" cy="598" r="4" fill="#a93072"/><path d="M52 178V639Q52 655 68 655H80" fill="none" stroke="#a93072" stroke-width="1.2" opacity=".38"/><path d="M52 178V639Q52 655 68 655H80" fill="none" stroke="#a93072" class="sm-signal" pathLength="1