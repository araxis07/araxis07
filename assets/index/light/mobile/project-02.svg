<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 213" width="440" height="213" role="img" aria-label="AI Knowledge Base. Private document workspaces, hybrid search and grounded AI answers with visible source citations. Stack: Next.js / Supabase / pgvector / Playwright. Status: Live AI flows require provider configuration.">
    <title>AI Knowledge Base. Private document workspaces, hybrid search and grounded AI answers with visible source citations. Stack: Next.js / Supabase / pgvector / Playwright. Status: Live AI flows require provider configuration.</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="440" height="213" fill="#faf9ff"/><text x="22" y="22" font-size="11" fill="#6743b4" letter-spacing="1">02 / DOCUMENT INTELLIGENCE</text><text x="22" y="50" font-size="19" fill="#232339" >AI Knowledge Base</text><text x="22" y="78" font-size="15" fill="#232339" >Private document workspaces, hybrid search</text><text x="22" y="101" font-size="15" fill="#232339" >and grounded AI answers with visible</text><text x="22" y="124" font-size="15" fill="#232339" >source citations.</text><text x="22" y="154" font-size="13" fill="#086d85" >Next.js / Supabase / pgvector / Playwright</text><text x="22" y="181" font-size="12" fill="#565e77" >Live AI flows require provider configuration.</text><path d="M22 202H418" stroke="#d2d3e4" class=""/></svg>
