    </style>
    <rect width="440" height="495" fill="#faf9ff"/><text x="22" y="31" font-size="12" fill="#6743b4" letter-spacing="1">EDUCATION / 2025</text><text x="22" y="58" font-size="17" fill="#232339" >Thai-Nichi Institute of Technology</text><text x="22" y="87" font-size="15" fill="#565e77" >B.Sc. Information Technology / Second-</text><text x="22" y="110" font-size="15" fill="#565e77" >Class Honors.</text><path d="M22 137H418" stroke="#d2d3e4" class=""/><text x="22" y="164" font-size="12" fill="#6743b4" letter-spacing="1">EXPERIENCE / 4 MONTHS</text><text x="22" y="191" font-size="17" fill="#232339" >IT Support Intern / Suvarnabhumi</text><text x="22" y="215" font-size="17" fill="#232339" >Airport</text><text x="22" y="244" font-size="15" fill="#565e77" >Computer-system troubleshooting,</text><text x="22" y="267" font-size="15" fill="#565e77" >operational support and a data-</text><text x="22" y="290" font-size="15" fill="#565e77" >visualization dashboard.</text><path d="M22 317H418" stroke="#d2d3e4" class=""/><text x="22" y="344" font-size="12" fill="#6743b4" letter-spacing="1">CURRENT CHAPTER / 2026</text><text x="22" y="371" font-size="17" fill="#232339" >Tokyo, Japan</text><text x="22" y="400" font-size="15" fill="#565e77" >Studying Japanese while continuing to</text><text x="22" y="423" font-size="15" fill="#565e77" >explore software, data and new</text><text x="22" y="446" font-size="15" fill="#565e77" >experiences.</text><path d="M22 473H418" stroke="#d2d3e4" class=""/></svg>
