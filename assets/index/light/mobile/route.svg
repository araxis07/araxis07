    </style>
    <rect width="440" height="584" fill="#faf9ff"/><text x="22" y="31" font-size="12" fill="#6743b4" letter-spacing="1">EDUCATION / 2025</text><text x="22" y="62" font-size="19" fill="#232339" >Thai-Nichi Institute of</text><text x="22" y="89" font-size="19" fill="#232339" >Technology</text><text x="22" y="122" font-size="15" fill="#565e77" >B.Sc. Information Technology / Second-</text><text x="22" y="146" font-size="15" fill="#565e77" >Class Honors.</text><path d="M22 176H418" stroke="#d2d3e4" class=""/><text x="22" y="210" font-size="12" fill="#6743b4" letter-spacing="1">EXPERIENCE / 4 MONTHS</text><text x="22" y="241" font-size="19" fill="#232339" >IT Support Intern /</text><text x="22" y="268" font-size="19" fill="#232339" >Suvarnabhumi Airport</text><text x="22" y="301" font-size="15" fill="#565e77" >Computer-system troubleshooting,</text><text x="22" y="325" font-size="15" fill="#565e77" >operational support and a data-</text><text x="22" y="349" font-size="15" fill="#565e77" >visualization dashboard.</text><path d="M22 379H418" stroke="#d2d3e4" class=""/><text x="22" y="413" font-size="12" fill="#6743b4" letter-spacing="1">CURRENT CHAPTER / 2026</text><text x="22" y="444" font-size="19" fill="#232339" >Tokyo, Japan</text><text x="22" y="477" font-size="15" fill="#565e77" >Studying Japanese while continuing to</text><text x="22" y="501" font-size="15" fill="#565e77" >explore software, data and new</text><text x="22" y="525" font-size="15" fill="#565e77" >experiences.</text><path d="M22 555H418" stroke="#d2d3e4" class=""/></svg>
