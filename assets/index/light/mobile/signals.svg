<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 345" width="440" height="345" role="img" aria-label="Portfolio scope: six featured projects, two travel experiences and one terminal simulation. These are scope counts, not live GitHub activity statistics.">
    <title>Portfolio scope: six featured projects, two travel experiences and one terminal simulation. These are scope counts, not live GitHub activity statistics.</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="440" height="345" fill="#faf9ff"/><text x="22" y="25" font-size="12" fill="#565e77" letter-spacing="2">PORTFOLIO AT A GLANCE</text><path d="M22 43H418" stroke="#d2d3e4" class=""/><text x="22" y="93" font-size="28" fill="#6743b4" >06</text><text x="90" y="76" font-size="12" fill="#232339" >FEATURED PROJECTS</text><text x="90" y="99" font-size="11" fill="#565e77" >Documented in this profile.</text><text x="22" y="183" font-size="28" fill="#6743b4" >02</text><text x="90" y="166" font-size="12" fill="#232339" >TRAVEL EXPERIENCES</text><text x="90" y="189" font-size="11" fill="#565e77" >Japan and the United States.</text><text x="22" y="273" font-size="28" fill="#6743b4" >01</text><text x="90" y="256" font-size="12" fill="#232339" >TERMINAL SIMULATION</text><text x="90" y="279" font-size="11" fill="#565e77" >Nexus Tech / Stable Alpha.</text><path d="M22 312H418" stroke="#d2d3e4" class=""/><text x="22" y="333" font-size="9" fill="#565e77" letter-spacing=".4">SCOPE COUNTS / NOT LIVE GITHUB STATISTICS</text></svg>
