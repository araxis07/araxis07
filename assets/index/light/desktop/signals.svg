<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 177" width="1000" height="177" role="img" aria-label="Portfolio scope: six featured projects, two travel experiences and one terminal simulation. These are scope counts, not live GitHub activity statistics.">
    <title>Portfolio scope: six featured projects, two travel experiences and one terminal simulation. These are scope counts, not live GitHub activity statistics.</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="1000" height="177" fill="#faf9ff"/><text x="48" y="25" font-size="12" fill="#565e77" letter-spacing="2">PORTFOLIO AT A GLANCE</text><path d="M48 43H952" stroke="#d2d3e4" class=""/><text x="48" y="102" font-size="28" fill="#6743b4" >06</text><text x="116" y="85" font-size="12" fill="#232339" >FEATURED PROJECTS</text><text x="48" y="134" font-size="12" fill="#565e77" >Documented in this profile.</text><text x="360" y="102" font-size="28" fill="#6743b4" >02</text><text x="428" y="85" font-size="12" fill="#232339" >TRAVEL EXPERIENCES</text><text x="360" y="134" font-size="12" fill="#565e77" >Japan and the United States.</text><text x="672" y="102" font-size="28" fill="#6743b4" >01</text><text x="740" y="85" font-size="12" fill="#232339" >TERMINAL SIMULATION</text><text x="672" y="134" font-size="12" fill="#565e77" >Nexus Tech / Stable Alpha.</text><path d="M48 144H952" stroke="#d2d3e4" class=""/><text x="48" y="165" font-size="11" fill="#565e77" letter-spacing=".4">SCOPE COUNTS / NOT LIVE GITHUB STATISTICS</text></svg>
