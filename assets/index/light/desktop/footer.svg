<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 122" width="1000" height="122" role="img" aria-label="Stay curious. Build with intent. Aon / araxis07 / building beyond the horizon">
    <title>Stay curious. Build with intent. Aon / araxis07 / building beyond the horizon</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="1000" height="122" fill="#faf9ff"/><path d="M48 20H952" stroke="#6743b4" class=""/><text x="48" y="51" font-size="17" fill="#6743b4" >STAY CURIOUS. BUILD WITH INTENT.</text><text x="48" y="77" font-size="14" fill="#565e77" >Code / data / finance / Japanese / new experiences</text><text x="48" y="104" font-size="11" fill="#565e77" letter-spacing=".5">ARAXIS07 / BUILDING BEYOND THE HORIZON</text></svg>
