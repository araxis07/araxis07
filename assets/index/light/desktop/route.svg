<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-label="Journey: TNI Information Technology graduate in 2025, four-month IT Support internship at Suvarnabhumi Airport, and Japanese study in Tokyo in 2026">
    <title>Journey: TNI Information Technology graduate in 2025, four-month IT Support internship at Suvarnabhumi Airport, and Japanese study in Tokyo in 2026</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="1000" height="356" fill="#faf9ff"/><text x="48" y="31" font-size="12" fill="#6743b4" letter-spacing="1">EDUCATION / 2025</text><text x="48" y="58" font-size="17" fill="#232339" >Thai-Nichi Institute of Technology</text><text x="48" y="87" font-size="15" fill="#565e77" >B.Sc. Information Technology / Second-Class Honors.</text><path d="M48 114H952" stroke="#d2d3e4" class=""/><text x="48" y="141" font-size="12" fill="#6743b4" letter-spacing="1">EXPERIENCE / 4 MONTHS</text><text x="48" y="168" font-size="17" fill="#232339" >IT Support Intern / Suvarnabhumi Airport</text><text x="48" y="197" font-size="15" fill="#565e77" >Computer-system troubleshooting, operational support and a data-visualization dashboard.</text><path d="M48 224H952" stroke="#d2d3e4" class=""/><text x="48" y="251" font-size="12" fill="#6743b4" letter-spacing="1">CURRENT CHAPTER / 2026</text><text x="48" y="278" font-size="17" fill="#232339" >Tokyo, Japan</text><text x="48" y="307" font-size="15" fill="#565e77" >Studying Japanese while continuing to explore software, data and new experiences.</text><path d="M48 334H952" stroke="#d2d3e4" class=""/></svg>
