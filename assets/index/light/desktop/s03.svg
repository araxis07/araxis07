<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="03 / PROJECTS">
    <title>03 / PROJECTS</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="1000" height="64" fill="#faf9ff"/><path d="M48 13H952" stroke="#d2d3e4" class=""/><text x="48" y="47" font-size="24" fill="#6743b4" >03</text><text x="98" y="44" font-size="14" fill="#232339" letter-spacing="1.7">PROJECTS</text><text x="952" y="44" font-size="11" fill="#565e77" text-anchor="end">~/selected</text></svg>
