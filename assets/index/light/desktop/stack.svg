<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 257" width="1000" height="257" role="img" aria-label="Technical stack includes React, Next.js, TypeScript, JavaScript, Tailwind CSS, Material UI, Node.js, NestJS, Express, REST APIs, authentication, PostgreSQL, MySQL, Supabase, SQLite, pgvector, Recharts, Git, GitHub Actions, Docker, Playwright, Vite and Postman">
    <title>Technical stack includes React, Next.js, TypeScript, JavaScript, Tailwind CSS, Material UI, Node.js, NestJS, Express, REST APIs, authentication, PostgreSQL, MySQL, Supabase, SQLite, pgvector, Recharts, Git, GitHub Actions, Docker, Playwright, Vite and Postman</title><style>:root{--bg:#faf9ff;--ink:#232339;--muted:#565e77;--rule:#d2d3e4;--accent:#6743b4;--cyan:#086d85;--pink:#a93072;--soft:#eeeaf8;}text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .flow{stroke-dasharray:3 10;animation:flow 3s linear infinite}
    .cursor{animation:cursor 1.5s steps(1) infinite}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes cursor{50%{opacity:.18}}
    @keyframes breathe{50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.flow,.cursor,.breathe{animation:none}}
    </style>
    <rect width="1000" height="257" fill="#faf9ff"/><text x="48" y="29" font-size="12" fill="#6743b4" letter-spacing="2">FRONTEND</text><text x="48" y="60" font-size="14" fill="#232339" >React / Next.js / TypeScript</text><text x="48" y="85" font-size="14" fill="#565e77" >JavaScript / Tailwind CSS / Material UI</text><path d="M48 123H470" stroke="#d2d3e4" class=""/><text x="512" y="29" font-size="12" fill="#6743b4" letter-spacing="2">BACKEND</text><text x="512" y="60" font-size="14" fill="#232339" >Node.js / NestJS / Express</text><text x="512" y="85" font-size="14" fill="#565e77" >REST APIs / Authentication</text><path d="M512 123H934" stroke="#d2d3e4" class=""/><text x="48" y="151" font-size="12" fill="#6743b4" letter-spacing="2">DATA</text><text x="48" y="182" font-size="14" fill="#232339" >PostgreSQL / MySQL / Supabase</text><text x="48" y="207" font-size="14" fill="#565e77" >SQLite / pgvector / Recharts</text><path d="M48 245H470" stroke="#d2d3e4" class=""/><text x="512" y="151" font-size="12" fill="#6743b4" letter-spacing="2">WORKFLOW</text><text x="512" y="182" font-size="14" fill="#232339" >Git / GitHub Actions / Docker</text><text x="512" y="207" font-size="14" fill="#565e77" >Playwright / Vite / Postman</text><path d="M512 245H934" stroke="#d2d3e4" class=""/></svg>
